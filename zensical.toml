[project]
site_name = "firebirdsql-run"
repo_url  = "https://github.com/deadnews/firebirdsql-run"
edit_uri  = "blob/main/docs/"
nav       = [{ Overview = "index.md" }, { Changelog = "changelog.md" }]
watch     = ["src", "README.md", "CHANGELOG.md"]

[project.theme]
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"

[project.theme.palette.toggle]
name = "Switch to light mode"
icon = "material/brightness-auto"

[[project.theme.palette]]
media  = "(prefers-color-scheme: light)"
scheme = "default"

[project.theme.palette.toggle]
name = "Switch to dark mode"
icon = "material/brightness-7"

[[project.theme.palette]]
media  = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.theme.palette.toggle]
name = "Switch to system preference"
icon = "material/brightness-4"

[project.markdown_extensions.attr_list]

[project.markdown_extensions."pymdownx.snippets"]

[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions.toc]
permalink = true

[project.plugins.api-autonav]
modules           = ["src/firebirdsql_run"]
nav_section_title = "API reference"

[project.plugins.mkdocstrings.handlers.python]
paths       = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_section_style    = "table"
docstring_style            = "google"
filters                    = ["!^_"]
heading_level              = 1
inherited_members          = true
members_order              = "source"
merge_init_into_class      = true
separate_signature         = true
show_root_full_path        = false
show_root_heading          = true
show_signature_annotations = true
show_submodules            = true
show_symbol_type_heading   = true
show_symbol_type_toc       = true
signature_crossrefs        = true
summary                    = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true
